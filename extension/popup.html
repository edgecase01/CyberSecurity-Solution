<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybersec Shield</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyber: { 400: "#22d3ee", 500: "#06b6d4" },
            },
          },
        },
      };
    </script>
  </head>
  <body class="m-0 min-h-[380px] w-[360px] bg-slate-950 text-slate-100 antialiased">
    <div class="relative overflow-hidden p-5">
      <div
        class="pointer-events-none absolute -right-10 -top-10 h-40 w-40 rounded-full bg-cyan-500/10 blur-3xl"
      ></div>

      <header class="relative mb-5 flex items-center gap-3">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-xl border border-cyan-500/30 bg-cyan-500/10 text-xl"
        >
          🛡️
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Cybersec Shield</h1>
          <p class="text-xs text-slate-400">Tab safety status</p>
        </div>
      </header>

      <div id="status-card" class="relative rounded-2xl border border-white/10 bg-white/5 p-4">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-xs font-medium uppercase tracking-wider text-slate-400">Current tab</p>
            <p id="tab-url" class="mt-1 break-all text-sm text-slate-200">Loading…</p>
          </div>
          <span
            id="status-badge"
            class="shrink-0 rounded-full px-3 py-1 text-xs font-semibold bg-slate-800 text-slate-300"
          >
            …
          </span>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-3 text-center">
          <div class="rounded-xl border border-white/10 bg-slate-900/60 p-3">
            <p class="text-[10px] uppercase tracking-wide text-slate-500">Verdict</p>
            <p id="verdict" class="mt-1 text-sm font-semibold">—</p>
          </div>
          <div class="rounded-xl border border-white/10 bg-slate-900/60 p-3">
            <p class="text-[10px] uppercase tracking-wide text-slate-500">Confidence</p>
            <p id="confidence" class="mt-1 text-sm font-semibold">—</p>
          </div>
        </div>

        <p id="status-message" class="mt-4 text-xs leading-relaxed text-slate-400">
          Scanning this page…
        </p>
      </div>

      <button
        id="rescan-btn"
        type="button"
        class="mt-4 w-full rounded-xl bg-cyan-500 py-2.5 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400"
      >
        Rescan tab
      </button>

      <p class="mt-4 text-center text-[10px] text-slate-500">
        Backend: localhost:8000 · Manifest V3
      </p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
